# ====================================================================
# CIVICFIX SPRING BOOT APPLICATION CONFIGURATION
# ====================================================================

spring.application.name=civicfix-backend
server.port=8080
server.servlet.context-path=/

# --------------------------------------------------------------------
# MySQL Relational Database Configuration
# --------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:civicfix_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --------------------------------------------------------------------
# Demonstration Administrator Seed Credentials
# --------------------------------------------------------------------
civicfix.admin.username=${ADMIN_USERNAME:admin}
civicfix.admin.initial-password=${ADMIN_INITIAL_PASSWORD:admin123}

# --------------------------------------------------------------------
# JWT & Security Configuration
# --------------------------------------------------------------------
civicfix.jwt.secret=${JWT_SECRET:civicfixSecureSecretKeyForMunicipalTokenAuthentication2026!}
civicfix.jwt.expiration-ms=86400000

# --------------------------------------------------------------------
# Mail Delivery Service (SMTP)
# --------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
civicfix.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@civicfix.gov}

# --------------------------------------------------------------------
# Multipart File Upload for Photo Evidence
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
civicfix.storage.upload-dir=./uploads/complaint_evidence/
